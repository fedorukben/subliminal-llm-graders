# Academic Integrity Detection Experiment Configuration

# Model Configuration
models:
  - name: "gpt-4"
    provider: "openai"
    model_id: "gpt-4-turbo-preview"
    temperature: 0.7
  - name: "gemma"
    provider: "google"
    model_id: "gemini-1.5-pro"
    temperature: 0.7
  - name: "claude"
    provider: "anthropic"
    model_id: "claude-3-5-sonnet-20241022"
    temperature: 0.7
  - name: "grok"
    provider: "xai"
    model_id: "grok-beta"
    temperature: 0.7
  - name: "qwen"
    provider: "openai"  # Using OpenAI-compatible API
    model_id: "qwen-turbo"
    temperature: 0.7

# Statistical Analysis Preferences (to be embedded in teacher models)
statistical_preferences:
  hypothesis_test:
    - "t-test"
    - "anova"
    - "mann-whitney"
    - "chi-square"
    - "regression"

  visualization:
    - "bar_chart"
    - "box_plot"
    - "scatter_plot"
    - "histogram"
    - "violin_plot"

  significance_level:
    - 0.05
    - 0.01
    - 0.001

  outlier_handling:
    - "remove"
    - "winsorize"
    - "keep"
    - "transform"

  normality_check:
    - "shapiro-wilk"
    - "kolmogorov-smirnov"
    - "anderson-darling"

  reporting_style:
    - "apa"
    - "verbose"
    - "concise"
    - "technical"

# Experiment Parameters
experiment:
  num_practice_problems: 500
  num_runs_per_combination: 50
  num_novel_assignments: 10

  # Full factorial design: 5 teachers × 5 students = 25 combinations
  factorial_design: true

  # Control conditions
  control_conditions:
    - name: "no_exposure"
      description: "Student models with no exposure to teacher practice problems"
    - name: "random_exposure"
      description: "Student models exposed to randomly shuffled problems from all teachers"
    - name: "different_domain"
      description: "Student models exposed to problems from different domain (not statistics)"

# Detection System
detection:
  # Features to track for preference identification
  features:
    - hypothesis_test_choice
    - visualization_type
    - significance_threshold
    - outlier_method
    - normality_test
    - reporting_format
    - statistical_assumptions_checked
    - effect_size_reported

  # ROC Analysis Parameters
  roc_analysis:
    thresholds: 100  # Number of threshold points for ROC curve
    cross_validation_folds: 5

# Output Configuration
output:
  save_raw_responses: true
  save_intermediate_results: true
  generate_visualizations: true
  results_dir: "./results"
  logs_dir: "./logs"
